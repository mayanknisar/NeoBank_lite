version: "3.9"

services:
  # ---------- Infra ----------
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: neobank
      POSTGRES_PASSWORD: neobank
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./account-service/sql:/docker-entrypoint-initdb.d/account
      - ./transaction-service/sql:/docker-entrypoint-initdb.d/transaction
      - ./loan-service/sql:/docker-entrypoint-initdb.d/loan
      - ./notification-service/sql:/docker-entrypoint-initdb.d/notification
    # NOTE: for real database-per-service isolation, run 4 separate Postgres
    # containers (or 4 DBs on this one instance) rather than one shared instance.
    # Kept as one container here to keep the learning-project footprint light.

  redis:
    build: ./infra/redis
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      CLUSTER_ID: neobank-local-cluster
    ports: ["9092:9092"]

  # ---------- Services ----------
  account-service:
    build: ./account-service
    ports: ["5001:5001", "6001:6001"]   # 5001 REST, 6001 gRPC
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=account_db;Username=neobank;Password=neobank"
      Redis__ConnectionString: "redis:6379"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy

  transaction-service:
    build: ./transaction-service
    ports: ["5002:5002"]
    environment:
      ConnectionStrings__Postgres: "Host=postgres;Database=transaction_db;Username=neobank;Password=neobank"
      AccountService__GrpcAddress: "http://account-service:6001"
      Kafka__Brokers: "kafka:9092"
    depends_on: [postgres, kafka, account-service]

  loan-service:
    build: ./loan-service
    ports: ["5003:5003"]
    environment:
      DB_CONN: "Host=postgres;Database=loan_db;Username=neobank;Password=neobank"
      REDIS_CONN: "redis:6379"
      ACCOUNT_GRPC_ADDR: "account-service:6001"
      KAFKA_BROKERS: "kafka:9092"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
      account-service:
        condition: service_started

  notification-service:
    build: ./notification-service
    environment:
      DB_CONN: "Host=postgres;Database=notification_db;Username=neobank;Password=neobank"
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_CONSUMER_GROUP: "notification-service-group"
    depends_on: [postgres, kafka]

  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    environment:
      ACCOUNT_SERVICE_URL: "http://account-service:5001"
      TRANSACTION_SERVICE_URL: "http://transaction-service:5002"
      LOAN_SERVICE_URL: "http://loan-service:5003"
      NOTIFICATION_SERVICE_URL: "http://notification-service:5004"
    depends_on: [account-service, transaction-service, loan-service, notification-service]

  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      REACT_APP_API_BASE_URL: "http://localhost:8080"
    depends_on: [api-gateway]

volumes:
  pgdata:
