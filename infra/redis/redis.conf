# Redis config for NeoBank Lite — cache-only usage.
#
# This Redis instance backs two things: Account Service's balance
# cache-aside reads and Loan Service's interest-rate-slab cache. Neither
# needs data to survive a restart — a cold cache just means the next read
# falls through to Postgres and repopulates it. So this config leans toward
# "fast and disposable" rather than "durable," which is the opposite of
# Redis's out-of-the-box defaults (RDB snapshotting + no eviction policy).

bind 0.0.0.0
protected-mode no
port 6379

# --- Memory & eviction -------------------------------------------------
# Cap memory so a runaway cache can't take down the container, and evict
# the least-recently-used keys once full instead of rejecting writes.
# allkeys-lru (not volatile-lru) because every key we write here already
# carries a TTL — see AccountCacheService's 30s TTL and Loan Service's
# ~1hr TTL — so there's nothing "permanent" in this instance to protect.
maxmemory 256mb
maxmemory-policy allkeys-lru

# --- Persistence ---------------------------------------------------------
# Disable RDB snapshotting and the AOF log entirely. This is a cache, not a
# system of record — Postgres is the source of truth for everything that
# ends up in here. Skipping disk writes also keeps latency predictable.
save ""
appendonly no

# --- Networking ------------------------------------------------------
timeout 0
tcp-keepalive 300
